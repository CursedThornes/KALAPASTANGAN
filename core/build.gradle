[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.ashley:ashley:$ashleyVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx-video:gdx-video:$gdxVideoVersion"
  api "com.bladecoder.ink:blade-ink:$bladeInkVersion"
  api "com.github.raeleus.stripe:freetype:$freetypeSkinVersion"
  api "com.github.tommyettinger:anim8-gdx:$anim8Version"
  api "com.github.tommyettinger:freetypist:$freetypistVersion"
  api "com.github.tommyettinger:regexodus:$regExodusVersion"
  api "com.github.tommyettinger:textratypist:$textratypistVersion"
  api "com.github.tommyettinger:typing-label:$typingLabelVersion"
  api "com.kotcrab.vis:vis-ui:$visUiVersion"
  api "io.github.quillraven.libktx:ktx-ashley:$ktxVersion"
  api "io.github.quillraven.libktx:ktx-box2d:$ktxVersion"
  api "net.onedaybeard.artemis:artemis-odb:$artemisOdbVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation "junit:junit:4.13.2"
}

test {
  testLogging {
    events "failed", "skipped"
  }
  // the dialogue tests read ../assets, so keep the project dir as the working directory
  workingDir = project.projectDir
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
